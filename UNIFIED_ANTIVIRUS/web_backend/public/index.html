<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antivirus Dashboard - Unified Shield</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .stat-card h3 {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card.success .value { color: #10b981; }
        .stat-card.warning .value { color: #f59e0b; }
        .stat-card.error .value { color: #ef4444; }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .chart-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .data-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .data-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters select, .filters input {
            padding: 10px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        .filters select:focus, .filters input:focus {
            border-color: #667eea;
        }

        .filters button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .filters button:hover {
            background: #5568d3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: #f9fafb;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        table td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            color: #6b7280;
        }

        table tr:hover {
            background: #f9fafb;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge.active { background: #d1fae5; color: #065f46; }
        .badge.inactive { background: #fee2e2; color: #991b1b; }
        .badge.info { background: #dbeafe; color: #1e40af; }
        .badge.warning { background: #fef3c7; color: #92400e; }
        .badge.error { background: #fee2e2; color: #991b1b; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .refresh-btn:active {
            transform: rotate(180deg);
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🛡️ Unified Shield Dashboard</h1>
            <p>Monitoreo en tiempo real de instancias de antivirus</p>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total de Logs</h3>
                <div class="value" id="totalLogs">0</div>
            </div>
            <div class="stat-card success">
                <h3>Instancias Activas</h3>
                <div class="value" id="activeInstances">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Instancias</h3>
                <div class="value" id="totalInstances">0</div>
            </div>
            <div class="stat-card error">
                <h3>Errores (24h)</h3>
                <div class="value" id="errorCount">0</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <h2>📊 Logs por Nivel</h2>
                <canvas id="logsLevelChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>📈 Estado de Instancias</h2>
                <canvas id="instancesChart"></canvas>
            </div>
        </div>

        <!-- Instances Table -->
        <div class="data-section">
            <h2>🖥️ Instancias Registradas</h2>
            <div class="filters">
                <select id="statusFilter">
                    <option value="">Todos los estados</option>
                    <option value="active">Activas</option>
                    <option value="inactive">Inactivas</option>
                </select>
                <button onclick="loadInstances()">Filtrar</button>
            </div>
            <div id="instancesTable"></div>
        </div>

        <!-- Logs Table -->
        <div class="data-section">
            <h2>📝 Logs Recientes</h2>
            <div class="filters">
                <select id="levelFilter">
                    <option value="">Todos los niveles</option>
                    <option value="INFO">INFO</option>
                    <option value="WARNING">WARNING</option>
                    <option value="ERROR">ERROR</option>
                </select>
                <input type="text" id="instanceFilter" placeholder="ID de instancia...">
                <button onclick="loadLogs()">Filtrar</button>
            </div>
            <div id="logsTable"></div>
        </div>
    </div>

    <!-- Refresh Button -->
    <button class="refresh-btn" onclick="refreshAll()" title="Actualizar datos">↻</button>

    <script>
        // Configuración
        const API_BASE_URL = 'https://unified-shield.vercel.app/api';
        const API_KEY = '5n8nAQro47O7bA8cjJXzHJxeTmKNQ9OcqRDurA1Xk4Y';
        
        let logsLevelChart, instancesChart;

        // Función para hacer peticiones a la API
        async function apiRequest(endpoint) {
            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                    headers: {
                        'X-API-Key': API_KEY
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('Error en API request:', error);
                return null;
            }
        }

        // Cargar estadísticas
        async function loadStats() {
            const data = await apiRequest('/stats');
            if (!data || !data.success) return;

            const stats = data.stats;
            document.getElementById('totalLogs').textContent = stats.total_logs || 0;
            document.getElementById('activeInstances').textContent = stats.active_instances || 0;
            document.getElementById('totalInstances').textContent = stats.total_instances || 0;
            document.getElementById('errorCount').textContent = stats.logs_by_level?.ERROR || 0;

            // Actualizar gráfico de logs por nivel
            updateLogsLevelChart(stats.logs_by_level || {});
        }

        // Cargar instancias
        async function loadInstances() {
            const statusFilter = document.getElementById('statusFilter').value;
            const endpoint = statusFilter ? `/instances?status=${statusFilter}` : '/instances';
            
            const data = await apiRequest(endpoint);
            if (!data || !data.success) {
                document.getElementById('instancesTable').innerHTML = '<div class="loading">Error cargando instancias</div>';
                return;
            }

            const instances = data.instances || [];
            
            if (instances.length === 0) {
                document.getElementById('instancesTable').innerHTML = `
                    <div class="empty-state">
                        <p>📭 No hay instancias registradas aún</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Hostname</th>
                            <th>Sistema Operativo</th>
                            <th>Versión</th>
                            <th>Estado</th>
                            <th>Última Conexión</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            instances.forEach(instance => {
                const lastSeen = instance.last_seen ? new Date(instance.last_seen).toLocaleString('es-ES') : 'Nunca';
                const statusClass = instance.status === 'active' ? 'active' : 'inactive';
                
                html += `
                    <tr>
                        <td><code>${instance.id.substring(0, 8)}...</code></td>
                        <td>${instance.hostname || 'N/A'}</td>
                        <td>${instance.os_info || 'N/A'}</td>
                        <td>${instance.antivirus_version || 'N/A'}</td>
                        <td><span class="badge ${statusClass}">${instance.status}</span></td>
                        <td>${lastSeen}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('instancesTable').innerHTML = html;

            // Actualizar gráfico de instancias
            updateInstancesChart(instances);
        }

        // Cargar logs
        async function loadLogs() {
            const levelFilter = document.getElementById('levelFilter').value;
            const instanceFilter = document.getElementById('instanceFilter').value;
            
            let endpoint = '/logs?limit=50';
            if (levelFilter) endpoint += `&level=${levelFilter}`;
            if (instanceFilter) endpoint += `&instance_id=${instanceFilter}`;
            
            const data = await apiRequest(endpoint);
            if (!data || !data.success) {
                document.getElementById('logsTable').innerHTML = '<div class="loading">Error cargando logs</div>';
                return;
            }

            const logs = data.logs || [];
            
            if (logs.length === 0) {
                document.getElementById('logsTable').innerHTML = `
                    <div class="empty-state">
                        <p>📭 No hay logs disponibles</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Nivel</th>
                            <th>Componente</th>
                            <th>Mensaje</th>
                            <th>Instancia</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            logs.forEach(log => {
                const timestamp = new Date(log.timestamp).toLocaleString('es-ES');
                const levelClass = log.level.toLowerCase();
                const instanceId = log.instance_id ? log.instance_id.substring(0, 8) + '...' : 'N/A';
                
                html += `
                    <tr>
                        <td>${timestamp}</td>
                        <td><span class="badge ${levelClass}">${log.level}</span></td>
                        <td>${log.component}</td>
                        <td>${log.message}</td>
                        <td><code>${instanceId}</code></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('logsTable').innerHTML = html;
        }

        // Actualizar gráfico de logs por nivel
        function updateLogsLevelChart(logsByLevel) {
            const ctx = document.getElementById('logsLevelChart');
            
            if (logsLevelChart) {
                logsLevelChart.destroy();
            }

            logsLevelChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(logsByLevel),
                    datasets: [{
                        data: Object.values(logsByLevel),
                        backgroundColor: [
                            '#3b82f6',
                            '#f59e0b',
                            '#ef4444',
                            '#10b981'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Actualizar gráfico de instancias
        function updateInstancesChart(instances) {
            const active = instances.filter(i => i.status === 'active').length;
            const inactive = instances.length - active;

            const ctx = document.getElementById('instancesChart');
            
            if (instancesChart) {
                instancesChart.destroy();
            }

            instancesChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Activas', 'Inactivas'],
                    datasets: [{
                        data: [active, inactive],
                        backgroundColor: ['#10b981', '#ef4444']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Refrescar todos los datos
        async function refreshAll() {
            await Promise.all([
                loadStats(),
                loadInstances(),
                loadLogs()
            ]);
        }

        // Cargar datos iniciales
        refreshAll();

        // Auto-refresh cada 30 segundos
        setInterval(refreshAll, 30000);
    </script>
</body>
</html>
