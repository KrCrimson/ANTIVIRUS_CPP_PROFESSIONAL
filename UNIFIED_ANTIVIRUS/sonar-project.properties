sonar.projectKey=KrCrimson_ANTIVIRUS_CPP_PROFESSIONAL
sonar.organization=krcrimson

# Project Information
sonar.projectName=Unified Shield Antivirus
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=core,plugins,utils,web_backend
sonar.tests=tests

# Python Configuration
sonar.python.version=3.8,3.9,3.10,3.11

# Coverage Reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Exclusions
sonar.exclusions=**/tests/**,**/build/**,**/dist/**,**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**

# Test Exclusions
sonar.test.exclusions=**/tests/**

# Coverage Exclusions
sonar.coverage.exclusions=**/tests/**,**/__init__.py

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gates
sonar.qualitygate.wait=true
